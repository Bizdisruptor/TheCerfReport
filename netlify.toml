[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Redirect bare /about to trailing slash (force=false prevents redirect loop)
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
  force = false

# Articles data — now served by the articles.js Netlify Function which
# pulls live from the Substack RSS feed. The path /data/articles.json
# is preserved so the prerender edge function and homepage JS keep working
# without modification.
[[redirects]]
  from = "/data/articles.json"
  to = "/.netlify/functions/articles"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache articles data — 10 minute browser cache; the function itself sets
# stale-while-revalidate so refreshes feel instant.
[[headers]]
  for = "/data/articles.json"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

# Edge function for homepage pre-rendering
[[edge_functions]]
  path = "/"
  function = "prerender"
